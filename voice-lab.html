<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>糖糖 AI · Voice Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f1;color:#302e2b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:44px 22px 80px}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.15em;color:#9a8d7b}.title{font-size:40px;font-weight:700;margin:8px 0}.sub{color:#777;line-height:1.7}.dog{font-size:72px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e7e0d8;border-radius:20px;padding:20px;box-shadow:0 8px 28px #00000008}.wide{grid-column:1/-1}h2{font-size:18px;margin:0 0 14px}label{font-size:13px;color:#777;display:block;margin-bottom:7px}.select,.text,button{font:inherit;border:1px solid #ddd5cc;border-radius:12px;background:white;padding:11px 13px}.select,.text{width:100%}.text{min-height:120px;resize:vertical;line-height:1.7}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.range{width:100%}.value{float:right;color:#a48b70}.presets{display:flex;flex-wrap:wrap;gap:8px}.preset{cursor:pointer;background:#faf8f5}.primary{width:100%;background:#302e2b;color:white;border-color:#302e2b;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.hint,.status{font-size:12px;color:#888;line-height:1.6;margin-top:10px}.status{padding:11px 13px;border-radius:10px;background:#faf8f5}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.score{border:1px solid #eee7df;border-radius:12px;padding:12px;font-size:13px}.score strong{display:block;font-size:20px;margin-top:4px}.history{margin-top:14px}.history-item{display:flex;justify-content:space-between;border-bottom:1px solid #eee7df;padding:10px 0;font-size:12px;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.scores{grid-template-columns:1fr 1fr}.title{font-size:32px}.dog{font-size:52px}}</style></head><body><main class="wrap"><header class="hero"><div><div class="eyebrow">TANGTANG AI · VOICE LAB V1.0</div><div class="title">糖糖声音实验室</div><div class="sub">先把“听起来像糖糖”做好。<br>可爱，但不幼稚；温柔，但不做作；听 100 次也不烦。</div></div><div class="dog">🐶</div></header><div class="grid"><section class="card"><h2>① 选择声音</h2><label>浏览器可用中文声音</label><select id="voice" class="select"></select><div class="hint">不同 Mac / 浏览器可用声音不同。先盲听候选，再确定最终 TTS。</div></section><section class="card"><h2>② 糖糖情绪</h2><div class="presets"><button class="preset" data-e="caring">温柔关心</button><button class="preset" data-e="happy">开心</button><button class="preset" data-e="curious">好奇</button><button class="preset" data-e="welcome">欢迎</button><button class="preset" data-e="sleepy">困倦</button></div><div class="hint">情绪只做轻微调整，不做夸张卡通音。</div></section><section class="card"><h2>③ 声音参数</h2><div class="row"><div><label>语速 <span id="rateV">0.92</span></label><input id="rate" class="range" type="range" min=".7" max="1.2" step=".01" value=".92"></div><div><label>音高 <span id="pitchV">1.05</span></label><input id="pitch" class="range" type="range" min=".8" max="1.3" step=".01" value="1.05"></div></div><label style="margin-top:14px">音量 <span id="volumeV">0.75</span></label><input id="volume" class="range" type="range" min=".2" max="1" step=".01" value=".75"></section><section class="card"><h2>④ 固定测试句</h2><div class="presets"><button class="preset s">看了好久啦，要不要陪我起来走两步？</button><button class="preset s">你回来啦，我等你好久啦。</button><button class="preset s">今天有点凉哦，出门记得多穿一件。</button><button class="preset s">糖糖困啦，我们一起睡觉吧。</button></div></section><section class="card wide"><h2>⑤ 试听</h2><textarea id="text" class="text">看了好久啦……要不要陪我起来走两步？</textarea><div class="actions"><button id="play" class="primary">▶ 播放糖糖</button><button id="stop">■ 停止</button></div><div id="status" class="status">准备好了，请选择声音。</div></section><section class="card wide"><h2>⑥ 盲听评分</h2><div class="scores"><div class="score">自然程度<input class="range r" data-k="natural" type="range" min="1" max="10" value="7"><strong id="natural">7</strong>/10</div><div class="score">糖糖匹配度<input class="range r" data-k="match" type="range" min="1" max="10" value="7"><strong id="match">7</strong>/10</div><div class="score">儿童安全感<input class="range r" data-k="safe" type="range" min="1" max="10" value="8"><strong id="safe">8</strong>/10</div><div class="score">耐听程度<input class="range r" data-k="tire" type="range" min="1" max="10" value="7"><strong id="tire">7</strong>/10</div><div class="score">可爱程度<input class="range r" data-k="cute" type="range" min="1" max="10" value="7"><strong id="cute">7</strong>/10</div><div class="score">AI 感低<input class="range r" data-k="ai" type="range" min="1" max="10" value="7"><strong id="ai">7</strong>/10</div></div><button id="save" class="primary" style="margin-top:14px">保存候选</button><div id="history" class="history"></div></section></div></main><script>const $=id=>document.getElementById(id),s=window.speechSynthesis;let vs=[];const presets={caring:[.92,1.05,.75],happy:[1,1.1,.78],curious:[.94,1.12,.75],welcome:[1.02,1.08,.8],sleepy:[.78,.96,.62]};function voices(){vs=s.getVoices().filter(v=>/zh|Chinese|中文/i.test(v.lang+' '+v.name));if(!vs.length)vs=s.getVoices();$('voice').innerHTML=vs.map((v,i)=>`<option value="${i}">${v.name} · ${v.lang}</option>`).join('')}voices();s.onvoiceschanged=voices;function param(id,v){$(id).value=v;$(id+'V').textContent=Number(v).toFixed(2)}document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{let p=presets[b.dataset.e];param('rate',p[0]);param('pitch',p[1]);param('volume',p[2]);$('status').textContent='当前情绪：'+b.textContent});document.querySelectorAll('.s').forEach(b=>b.onclick=()=>{$('text').value=b.textContent});['rate','pitch','volume'].forEach(id=>$(id).oninput=()=>$(id+'V').textContent=Number($(id).value).toFixed(2));$('play').onclick=()=>{s.cancel();let u=new SpeechSynthesisUtterance($('text').value),v=vs[+$('voice').value];if(v)u.voice=v;u.lang='zh-CN';u.rate=+$('rate').value;u.pitch=+$('pitch').value;u.volume=+$('volume').value;u.onstart=()=>$('status').textContent='糖糖正在说话……';u.onend=()=>$('status').textContent='播放完成。';s.speak(u)};$('stop').onclick=()=>{s.cancel();$('status').textContent='已停止。'};document.querySelectorAll('.r').forEach(x=>x.oninput=()=>$(x.dataset.k).textContent=x.value);function history(){let h=JSON.parse(localStorage.tangtangVoiceHistory||'[]');$('history').innerHTML=h.map(x=>`<div class="history-item"><span>${x.voice}<br>${x.text}</span><b>${x.avg}/10</b></div>`).join('')||'<div class="hint">还没有保存候选。</div>'}$('save').onclick=()=>{let a=[...document.querySelectorAll('.r')].map(x=>+x.value),avg=(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1),h=JSON.parse(localStorage.tangtangVoiceHistory||'[]');h.unshift({voice:vs[+$('voice').value]?.name||'未知',text:$('text').value,avg});localStorage.tangtangVoiceHistory=JSON.stringify(h.slice(0,30));history();$('status').textContent='已保存候选。'};history();</script></body></html>
