name: TangTang V5 tests

on:
  push:
    branches: [main, "feat/v5-life-companion-core"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python3 -m pip install Pillow
      - name: Run V5 tests
        run: python3 -m unittest discover -s tests/v5 -p 'test_*.py' -v
