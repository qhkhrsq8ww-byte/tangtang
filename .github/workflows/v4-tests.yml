name: TangTang V4 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install Pillow
      - name: Check Python source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = sorted(Path(".").rglob("*.py"))
          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          files = [p for p in files if not any(part in excluded for part in p.parts)]
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          print(f"Compiled {len(files) - len(failures)}/{len(files)} Python files")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          PY
      - name: Check shell syntax
        run: |
          set -eu
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do bash -n "$file"; done
      - name: Run V4 unit tests
        run: python tests/v4/run.py
