<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'>

    <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>文件推送 - 沙发管家远程控制</title>
	<link rel="stylesheet" href="css/index.css">
	<link rel="stylesheet" type="text/css" href="/css/dropzone.css">
	<script type="text/javascript">
	var sf = {};
	sf.userAgent=navigator.userAgent.toLowerCase();sf.is_ios=/(iphone|ipad|ipod)/i.test(sf.userAgent)?true:false;sf.userAgent=navigator.userAgent.toLowerCase();sf.is_ios=/(iphone|ipad|ipod)/i.test(sf.userAgent)?true:false;sf.is_ipad=/(ipad)/i.test(sf.userAgent)?true:false;sf.is_firefox=sf.userAgent.indexOf("firefox")>=0?true:false;sf.is_opera=navigator.appName.indexOf("Opera")>=0?true:false;sf.is_safari=sf.userAgent.indexOf("safari")>=0?true:false;sf.is_chrome=sf.userAgent.indexOf("chrome")>=0?true:false;if(sf.is_chrome){sf.is_safari=false}sf.is_ie=navigator.appName=="Microsoft Internet Explorer"?true:false;sf.ie=(sf.userAgent.indexOf("msie")!=-1&&!sf.is_opera)&&sf.userAgent.substr(sf.userAgent.indexOf("msie")+5,3);sf.is_ipad=/(ipad)/i.test(sf.userAgent)?true:false;sf.is_firefox=sf.userAgent.indexOf("firefox")>=0?true:false;sf.is_opera=navigator.appName.indexOf("Opera")>=0?true:false;sf.is_safari=sf.userAgent.indexOf("safari")>=0?true:false;sf.is_chrome=sf.userAgent.indexOf("chrome")>=0?true:false;if(sf.is_chrome){sf.is_safari=false}sf.is_ie=navigator.appName=="Microsoft Internet Explorer"?true:false;sf.ie=(sf.userAgent.indexOf("msie")!=-1&&!sf.is_opera)&&sf.userAgent.substr(sf.userAgent.indexOf("msie")+5,3);
	</script>
	<style type="text/css">
        .container {
            width: 100%;
            max-width: 800px;
        }
        .tips {
            color: #888;
            margin: 80px auto 0;
            text-align: right;
        }
		#dropzone {
			margin: 10px auto 0;
			width: 100%;
			max-width: 800px;
			background-color: #ffffff;
			border-radius: 10px;
			-webkit-box-shadow:  1px 1px 10px 1px rgba(0, 0, 0, 0.2);
			box-shadow:  1px 1px 10px 1px rgba(0, 0, 0, 0.2);
			overflow: hidden;
		}
		.dropzone {
			border: 5px solid #ffffff;
			background-color: #eee;
		}
		.fallback-file-wrapper {
		    width:100%;
            text-align:center;
		}
		#fallback-file {
		    display:block;
		    margin-top:50px;
		}
		.dz-browser-not-supported .fallback {
			text-align: center;
			position: absolute;
			width: 428px;
			height: 123px;
			margin-left: -214px;
			margin-top: -61.5px;
			top: 50%;
			left: 50%;
		}
		.dz-browser-not-supported .fallback .uploading {
			font-family: "Helvetica Neue", Helvetica, Arial, sans-serif, "Microsoft YaHei";
			font-size:3em;
			color:#999;
		}
	</style>
    <!--[if IE 6]>
    <style type="text/css">
    .dropzone {
        height:400px;
    }
    </style>
    <![endif]-->
</head>
<body>
	<div class="topbar">
        <a href="/" title="返回首页"><img src="/images/index_logo.png" alt="沙发管家远程控制" title="沙发管家远程控制"></a>
	</div>
	<div class="container">
        <p class="tips" id="available_size"></p>
		<div id="dropzone">
			<form action="/?fallback=1" method="post" class="dropzone" id="shafa-dropzone" enctype="multipart/form-data">
			  <div class="fallback" id="fallback">
			  </div>
			  <div class="fallback-file-wrapper">
			  <input id="fallback-file" name="file1" type="file"/>
			  </div>
			</form>
		</div>
	</div>
    <div class="footer">
        <a target="_blank" href="http://app.shafa.com">沙发管家</a>/<a target="_blank" href="http://www.shafa.com">沙发网</a>/<span>心梦想公司版权所有</span>
    </div>
	<script type="text/javascript" src="/js/jquery-1.10.2.min.js"></script>
	<script type="text/javascript">
	var fallback_foo = function(){
	    $('#shafa-dropzone').attr('action', '/?fallback=1');
        $('#fallback-file').show().css('margin', '50px auto auto');
        $('#fallback').css('background-image','none');
        $('#fallback').html('<span class="uploading">文件推送</span>');
		$('#shafa-dropzone').submit(function(event) {
            $('#fallback').html('<span class="uploading">正在上传...</span>');
            $('#fallback-file').hide();
            return true;
		});
		$('#shafa-dropzone').addClass('dz-browser-not-supported');
		$('#fallback-file').click(function() {
		    var fallback = $('#fallback');
			if (fallback.hasClass('disabled')) return false;
            fallback.addClass('disabled');
            fallback.removeClass('disabled');
		});
		$('#fallback-file').on('change', function() {
			$('#shafa-dropzone').submit();
		});
	};
    var suck_lte_ie8 = false;
	</script>
    <script type="text/javascript" src="/js/dropzone.js"></script>
    <!--[if lt IE 8]>
    <script type="text/javascript">
        suck_lte_ie8 = true;
        fallback_foo();
    </script>
    <![endif]-->
    <script type="text/javascript">
        if (!suck_lte_ie8) {
            var filesize = function(size) {
                var string;
                if (size >= 100000000000) {
                    size = size / 100000000000;
                    string = "TB";
                } else if (size >= 100000000) {
                    size = size / 100000000;
                    string = "GB";
                } else if (size >= 100000) {
                    size = size / 100000;
                    string = "MB";
                } else if (size >= 100) {
                    size = size / 100;
                    string = "KB";
                } else {
                    size = size * 10;
                    string = "b";
                }
                return (Math.round(size) / 10) + string;
            }
			var max_file_size = parseFloat('54223982592');
			if (max_file_size) {
                $('#available_size').html('设备可用空间: '+ filesize(max_file_size));
				max_file_size = parseInt(max_file_size / 1024 /1024);
			} else {
				max_file_size = 1024*1024;
			}
            $("#fallback-file").hide();
            $('#shafa-dropzone').attr('action', '/');
            Dropzone.options.shafaDropzone = {
              paramName: "file1", // The name that will be used to transfer the file
              maxFilesize: max_file_size, // MB
              dictDefaultMessage: "点击上传，或者拖拽文件到这里",
              dictFallbackMessage: "",
              dictFallbackText: "",
              dictFileTooBig: "文件大小不能超过{{maxFilesize}}MB, 上传的文件为 {{filesize}}MB.",
              dictInvalidFileType: "你不能上传这个类型的文件.",
              dictResponseError: "服务器响应错误，代码：{{statusCode}} .",
              dictCancelUpload: "取消上传",
              dictCancelUploadConfirmation: "你确定要取消这次上传?",
              dictRemoveFile: "移除文件",
              forceFallback: false,
              fallback: fallback_foo
            };
        }
    </script>

</body>
</html>
