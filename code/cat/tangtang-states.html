<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>糖糖 · 16 状态表情机</title>
<style>
  :root {
    --bg-1: #FFF8F0;
    --bg-2: #FFE9D9;
    --ink: #5a3a20;
    --collar: #FFD34D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    padding: 24px 16px 80px;
    overflow-x: hidden;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 32px;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  h1::after { content: " 🐾"; }
  .subtitle { opacity: .65; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(180, 120, 60, .12);
    padding: 10px 8px 12px;
    text-align: center;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    user-select: none;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(180, 120, 60, .18);
  }
  .card.active {
    outline: 3px solid var(--collar);
    background: #FFFAEC;
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(180deg, #FFF5E8 0%, #FFE3CC 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage img.main {
    width: 96%;
    height: 96%;
    object-fit: contain;
    transition: filter .25s ease, transform .25s ease;
  }
  /* 表情层 */
  .stage svg.overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  /* 状态滤镜 */
  .filter-bright { filter: brightness(1.08) saturate(1.15); }
  .filter-soft { filter: brightness(1.03) saturate(.95); }
  .filter-night { filter: brightness(.55) saturate(.7) hue-rotate(-15deg); }
  .filter-dreamy { filter: brightness(1.05) hue-rotate(8deg); }
  .filter-energy { filter: saturate(1.25) contrast(1.05); }
  .filter-sleep { filter: brightness(.85) saturate(.8) blur(.3px); }
  .label {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .label .en { opacity: .55; font-weight: 400; font-size: 11px; }
  /* 提示气泡 */
  .bubble {
    position: absolute;
    background: #fff;
    border: 2px solid var(--collar);
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(0,0,0,.08);
    display: none;
  }
  .bubble.show { display: block; animation: pop .3s ease; }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 22px;
    width: 12px; height: 12px;
    background: #fff;
    border-right: 2px solid var(--collar);
    border-bottom: 2px solid var(--collar);
    transform: rotate(45deg);
  }
  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 控制栏 */
  .controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 999px;
    padding: 8px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .controls button {
    background: var(--collar);
    color: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .controls button:hover { background: #ffba2b; }
  /* 当前状态大字 */
  .current {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #fff;
    border: 2px solid var(--collar);
    border-radius: 14px;
    padding: 12px 18px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
    font-weight: 600;
  }
</style>
</head>
<body>
<header>
  <h1>糖糖 · 16 状态表情机</h1>
  <div class="subtitle">Bichon Frise · 白色蓬松比熊 · 黄色项圈 · 骨形铭牌</div>
</header>
<div class="current" id="currentState">当前：待机 idle</div>
<div class="grid" id="grid"></div>
<div class="bubble" id="bubble">汪汪～</div>
<div class="controls">
  <button onclick="autoPlay()">▶ 自动轮播</button>
  <button onclick="stopPlay()">⏸ 停止</button>
</div>

<script>
// 16 个状态定义：name(中文) / en / image / filter / overlay(SVG markup) / bubble
const STATES = [
  { name: "待机", en: "idle", img: "assets/tangtang-base.png", filter: "",
    overlay: blink(), bubble: "汪汪～" },
  { name: "开心", en: "happy", img: "assets/tangtang-happy.png", filter: "filter-bright",
    overlay: '<g class="hearts"><text x="50%" y="15%" font-size="32" text-anchor="middle" fill="#FF8FA3" opacity=".85">♥ ♥ ♥</text></g>',
    bubble: "糖糖好开心～" },
  { name: "好奇", en: "curious", img: "assets/tangtang-curious.png", filter: "filter-soft",
    overlay: '<g><text x="78%" y="22%" font-size="36" text-anchor="middle" fill="#4FC3F7" font-weight="bold" font-family="sans-serif">?</text></g>',
    bubble: "咦？这是什么呀？" },
  { name: "思考", en: "thinking", img: "assets/tangtang-base.png", filter: "",
    overlay: thinkingOverlay(), bubble: "让糖糖想想…" },
  { name: "关心", en: "caring", img: "assets/tangtang-base.png", filter: "filter-soft",
    overlay: '<g><text x="75%" y="25%" font-size="28" text-anchor="middle" fill="#FF8FA3">♥</text></g>',
    bubble: "糖糖在这里陪你～" },
  { name: "鼓励", en: "encouraging", img: "assets/tangtang-happy.png", filter: "filter-energy",
    overlay: '<g><text x="50%" y="14%" font-size="22" text-anchor="middle" fill="#FF8FA3" font-weight="bold">加油加油！</text></g>',
    bubble: "你已经超棒啦！" },
  { name: "走路", en: "walking", img: "assets/tangtang-base.png", filter: "filter-soft",
    overlay: motionDots(), bubble: "散步去咯～" },
  { name: "跑步", en: "running", img: "assets/tangtang-base.png", filter: "filter-energy",
    overlay: motionDots(true), bubble: "冲鸭冲鸭！" },
  { name: "坐下", en: "sitting", img: "assets/tangtang-base.png", filter: "",
    overlay: blink(), bubble: "糖糖坐好啦～" },
  { name: "趴下", en: "lying", img: "assets/tangtang-base.png", filter: "filter-soft",
    overlay: '<g><text x="50%" y="50%" font-size="14" text-anchor="middle" fill="#8B5E3C" opacity=".5">z</text></g>',
    bubble: "糖糖趴着等你～" },
  { name: "困倦", en: "sleepy", img: "assets/tangtang-base.png", filter: "filter-sleep",
    overlay: '<g><text x="50%" y="22%" font-size="34" text-anchor="middle" fill="#9575CD" opacity=".75">z z</text></g>',
    bubble: "糖糖有点困了…" },
  { name: "睡觉", en: "sleeping", img: "assets/tangtang-sleeping.png", filter: "filter-sleep",
    overlay: '<g><text x="65%" y="20%" font-size="38" text-anchor="middle" fill="#9575CD" opacity=".9">Z z z</text></g>',
    bubble: "呼噜噜…" },
  { name: "欢迎", en: "welcome", img: "assets/tangtang-happy.png", filter: "filter-bright",
    overlay: '<g><text x="50%" y="16%" font-size="22" text-anchor="middle" fill="#FFB300" font-weight="bold">欢迎回家！</text></g>',
    bubble: "航航回来啦！" },
  { name: "陪伴", en: "accompany", img: "assets/tangtang-base.png", filter: "filter-dreamy",
    overlay: '<g><text x="50%" y="50%" font-size="13" text-anchor="middle" fill="#8B5E3C" opacity=".55">～ ～ ～</text></g>',
    bubble: "糖糖陪你～" },
  { name: "醒来", en: "wake up", img: "assets/tangtang-curious.png", filter: "filter-bright",
    overlay: '<g><text x="72%" y="20%" font-size="28" text-anchor="middle" fill="#FFD700">☀</text></g>',
    bubble: "早安航航！" },
  { name: "夜晚", en: "night", img: "assets/tangtang-sleeping.png", filter: "filter-night",
    overlay: '<g><text x="20%" y="15%" font-size="24" text-anchor="middle" fill="#F0E68C">☾</text><text x="78%" y="22%" font-size="16" text-anchor="middle" fill="#F0E68C">★</text></g>',
    bubble: "晚安航航～" }
];

// 工具：眨眼叠加层
function blink() {
  return '<g class="blink"><path d="M40 48 q15 6 30 0 M140 48 q15 6 30 0" stroke="#3a2a18" stroke-width="3" fill="none" stroke-linecap="round" opacity="0"/></g>';
}
function thinkingOverlay() {
  return '<g><text x="50%" y="20%" font-size="20" text-anchor="middle" fill="#FF8FA3">💭</text><text x="78%" y="20%" font-size="20" text-anchor="middle" fill="#FF8FA3">?</text></g>';
}
function motionDots(fast) {
  const c = fast ? 5 : 3;
  let s = '<g>';
  for (let i=0;i<c;i++) s += `<text x="${15-i*4}%" y="${50+Math.random()*30}%" font-size="14" text-anchor="middle" fill="#8B5E3C" opacity=".${4-i}">·</text>`;
  return s + '</g>';
}

const grid = document.getElementById('grid');
const currentState = document.getElementById('currentState');
const bubble = document.getElementById('bubble');

let activeIdx = 0;
let autoTimer = null;

function render() {
  grid.innerHTML = '';
  STATES.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === activeIdx ? ' active' : '');
    card.innerHTML = `
      <div class="stage">
        <img class="main ${s.filter}" src="${s.img}" alt="${s.name}">
        <svg class="overlay" viewBox="0 0 200 200">${s.overlay}</svg>
      </div>
      <div class="label">${s.name} <span class="en">${s.en}</span></div>`;
    card.onclick = () => select(i);
    grid.appendChild(card);
  });
}

function select(i) {
  activeIdx = i;
  render();
  const s = STATES[i];
  currentState.textContent = `当前：${s.name} ${s.en}`;
  // 提示气泡动画
  bubble.textContent = s.bubble;
  bubble.style.top = '90px';
  bubble.style.right = '20px';
  bubble.classList.add('show');
  setTimeout(() => bubble.classList.remove('show'), 1800);
}

function autoPlay() {
  stopPlay();
  autoTimer = setInterval(() => select((activeIdx + 1) % STATES.length), 2500);
}
function stopPlay() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = null;
}

render();
select(0);
</script>
</body>
</html>
