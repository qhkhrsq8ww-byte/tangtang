<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>糖糖 V10 · Animation Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --fur: #FFFFFF;
    --cream: #F5D6A5;
    --bandana: #8EC5FF;
    --bandana-dark: #6B9BD1;
    --gold: #FFE4B5;
    --ink: #3d2b1f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1410; color: var(--ink); font-family: -apple-system, "PingFang SC", sans-serif; }
  .stage-wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
  }
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #fff8f0 center/cover no-repeat;
  }
  .stage img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .character {
    position: absolute;
    left: 50%;
    bottom: 4.5%;
    width: calc(512 / 1920 * 100%);
    height: auto;
    aspect-ratio: 1 / 1;
    transform: translateX(-50%);
    pointer-events: none;
    background: transparent;
  }
  .hud {
    position: absolute;
    left: 16px; top: 12px;
    color: #3d2b1f;
    background: rgba(255,255,255,.72);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.45;
  }
  .chrome {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 10px 12px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: linear-gradient(transparent, rgba(255,248,240,.92));
  }
  button {
    border: 0;
    background: var(--bandana);
    color: #1b2a40;
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.active { background: var(--bandana-dark); color: #fff; }
  body.projection .chrome, body.projection .hud { display: none; }
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <img class="bg" id="bg" alt="" />
    <canvas class="character" id="dog" width="512" height="512" aria-label="糖糖"></canvas>
    <div class="hud" id="hud">loading…</div>
    <div class="chrome" id="chrome"></div>
  </div>
</div>
<script src="frame_renderer.js"></script>
<script>
const ASSET = "../assets/character/tangtang";
const STATES = ["idle","listen","happy","encourage","sad","walk","run","sit","lie","sleep","blink"];
const FADE_MS_MIN = 100;
const FADE_MS_MAX = 200;
let meta = null;
let frames = [];
let images = [];
let idx = 0;
let timer = null;
let current = "idle";
let paused = false;
let renderer = null;
let prevImg = null;
let fadeUntil = 0;
let fadeMs = 150;

function query() {
  return new URLSearchParams(location.search);
}

async function loadMeta() {
  const res = await fetch(`${ASSET}/metadata.json`);
  meta = await res.json();
  document.getElementById("bg").src = `${ASSET}/backgrounds/living_room_cream.png`;
  const canvas = document.getElementById("dog");
  renderer = window.TangTangFrameRenderer.create(canvas);
  const chrome = document.getElementById("chrome");
  STATES.forEach((name) => {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => play(name);
    chrome.appendChild(b);
  });
  const q = query();
  if (q.get("projection") === "1") document.body.classList.add("projection");
  const start = STATES.includes(q.get("anim")) ? q.get("anim") : "idle";
  await play(start);
  const freeze = q.get("frame");
  if (freeze != null && freeze !== "") {
    idx = Math.max(0, Math.min(images.length - 1, parseInt(freeze, 10) || 0));
    paused = q.get("paused") !== "0";
    paint();
  }
}

async function exists(url) {
  try {
    const r = await fetch(url, { method: "HEAD" });
    return r.ok;
  } catch (e) { return false; }
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function play(name) {
  const spec = (meta.animations[name] || meta.animations.idle);
  const folder = spec.folder || name;
  const want = spec.frame_count || 1;
  const urls = [];
  for (let i = 0; i < want; i++) {
    const url = `${ASSET}/${folder}/${String(i).padStart(2,"0")}.png`;
    if (await exists(url)) urls.push(url);
  }
  if (spec.continuous && urls.length < (spec.min_playable || 8)) {
    return play("idle");
  }
  if (!urls.length) {
    const fallback = `${ASSET}/idle/00.png`;
    urls.push(fallback);
  }
  const loaded = [];
  for (const url of urls) {
    try { loaded.push(await loadImage(url)); } catch (e) { /* skip missing */ }
  }
  if (!loaded.length) return;
  prevImg = images[idx] || prevImg;
  frames = urls;
  images = loaded;
  idx = 0;
  current = urls[0].includes("/idle/") && name !== "idle" ? "idle" : name;
  fadeMs = Math.max(FADE_MS_MIN, Math.min(FADE_MS_MAX, fadeMs));
  fadeUntil = performance.now() + fadeMs;
  document.querySelectorAll(".chrome button").forEach((b) => {
    b.classList.toggle("active", b.textContent === name);
  });
  restartTimer();
}

function fpsNow(spec) {
  const name = current;
  return Math.min(spec.fps || 8, name === "sleep" ? 4 : 12);
}

function paint() {
  const spec = (meta.animations[current] || meta.animations.idle);
  const img = images[idx];
  if (!img || !renderer) return;
  const now = performance.now();
  let fadeT = 1;
  if (prevImg && now < fadeUntil) {
    fadeT = 1 - (fadeUntil - now) / fadeMs;
  }
  renderer.draw(img, prevImg, fadeT);
  if (fadeT >= 1) prevImg = img;
  const fps = fpsNow(spec);
  document.getElementById("hud").innerHTML =
    `State ${ (spec.preferred_state || current).toUpperCase() } · ${current}<br>` +
    `frame ${idx + 1}/${images.length} · ${fps} fps · loop ${spec.loop}<br>` +
    `canvas 1920×1080 · character 512 · scale 1.0 · clearRect`;
}

function restartTimer() {
  if (timer) clearInterval(timer);
  const spec = (meta.animations[current] || meta.animations.idle);
  const fps = fpsNow(spec);
  const tick = () => {
    if (paused || !images.length) { paint(); return; }
    paint();
    idx = spec.loop ? (idx + 1) % images.length : Math.min(idx + 1, images.length - 1);
  };
  tick();
  timer = setInterval(tick, Math.max(1000 / fps, 1000 / 12));
}

loadMeta().catch((err) => {
  document.getElementById("hud").textContent = "metadata missing — open via python3 -m http.server 8765";
  console.error(err);
});
</script>
</body>
</html>
